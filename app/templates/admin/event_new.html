{% extends "admin/_base.html" %}
{% block content %}
<h1>New Event</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<p><a href="/admin/events">← Back to events</a></p>
<form method="post" action="/admin/events" enctype="multipart/form-data">
  <input name="year" placeholder="Year" required>
  <input name="name" placeholder="Name" required>
  <input name="date" placeholder="Date (YYYY-MM-DD)" required>
  <input name="location" placeholder="Location" required>
  <input name="address" placeholder="Address (optional, for the map)">
  <textarea name="description" placeholder="Description" required></textarea>
  <input name="ticket_price_cents" placeholder="Price (cents)" required>
  <input name="capacity" placeholder="Capacity" required>
  <input name="contact_name" placeholder="Contact name (optional)">
  <input type="email" name="contact_email" placeholder="Contact email (optional)">
  <input type="tel" name="contact_phone" placeholder="Contact phone (optional)">
  <label>Banner image (optional) <input type="file" name="banner_image" accept="image/jpeg,image/png,image/gif,image/webp"></label>
  <label>Banner image 2 (optional) <input type="file" name="banner_image_2" accept="image/jpeg,image/png,image/gif,image/webp"></label>
  <label>Banner image 3 (optional) <input type="file" name="banner_image_3" accept="image/jpeg,image/png,image/gif,image/webp"></label>
  <label>Logo (optional) <input type="file" name="logo_image" accept="image/jpeg,image/png,image/gif,image/webp"></label>
  {% include "admin/_timeline_fields.html" %}
  <button type="submit">Create</button>
</form>
{% include "admin/_image_size_guard.html" %}
{% endblock %}
