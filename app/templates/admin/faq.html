{% extends "admin/_base.html" %}
{% block content %}
<h1>FAQ</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<p>Shown on the public <a href="/faq" target="_blank" rel="noopener">FAQ</a> page,
   in the order below. Use the arrows to rearrange.</p>

<div class="table-scroll">
<table>
<tr><th>Order</th><th>Question &amp; answer</th><th></th></tr>
{% for f in entries %}
<tr>
  <td class="faq-move">
    <form method="post" action="/admin/faq/{{ f.faq_id }}/move">
      <input type="hidden" name="direction" value="up">
      <button type="submit" {% if loop.first %}disabled{% endif %} aria-label="Move up">▲</button>
    </form>
    <form method="post" action="/admin/faq/{{ f.faq_id }}/move">
      <input type="hidden" name="direction" value="down">
      <button type="submit" {% if loop.last %}disabled{% endif %} aria-label="Move down">▼</button>
    </form>
  </td>
  <td>
    <form method="post" action="/admin/faq/{{ f.faq_id }}" class="faq-edit-form">
      <label>Question <input type="text" name="question" value="{{ f.question }}" required></label>
      <label>Answer <textarea name="answer" required>{{ f.answer }}</textarea></label>
      <button type="submit">Save</button>
    </form>
  </td>
  <td>
    <form method="post" action="/admin/faq/{{ f.faq_id }}/delete"
          onsubmit="return confirm('Delete this FAQ entry?')">
      <button type="submit">Delete</button>
    </form>
  </td>
</tr>
{% endfor %}
</table>
</div>

<h2>Add a question</h2>
<form method="post" action="/admin/faq" class="event-images-form">
  <label>Question <input type="text" name="question" required></label>
  <label>Answer <textarea name="answer" required></textarea></label>
  <button type="submit">Add to the bottom</button>
</form>
{% endblock %}
