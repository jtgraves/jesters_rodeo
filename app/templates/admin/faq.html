{% extends "admin/_base.html" %}
{% block content %}
<h1>FAQ</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<p>Shown on the public <a href="/faq" target="_blank" rel="noopener">FAQ</a> page, in the order below.</p>

<ol class="faq-admin-list">
{% for f in entries %}
  <li class="faq-admin-card">
    <form method="post" action="/admin/faq/{{ f.faq_id }}" class="faq-admin-fields">
      <label>Question
        <input type="text" name="question" value="{{ f.question }}" required>
      </label>
      <label>Answer
        <textarea name="answer" rows="3" required>{{ f.answer }}</textarea>
      </label>
      <div class="faq-admin-actions">
        <span class="faq-admin-num">#{{ loop.index }}</span>
        <button class="icon-btn" type="submit" name="direction" value="up"
                formaction="/admin/faq/{{ f.faq_id }}/move" formnovalidate
                {% if loop.first %}disabled{% endif %} aria-label="Move up" title="Move up">&#9650;</button>
        <button class="icon-btn" type="submit" name="direction" value="down"
                formaction="/admin/faq/{{ f.faq_id }}/move" formnovalidate
                {% if loop.last %}disabled{% endif %} aria-label="Move down" title="Move down">&#9660;</button>
        <span class="faq-admin-spacer"></span>
        <button type="submit">Save</button>
        <button type="submit" class="btn-danger"
                formaction="/admin/faq/{{ f.faq_id }}/delete" formnovalidate
                onclick="return confirm('Delete this FAQ entry?')">Delete</button>
      </div>
    </form>
  </li>
{% endfor %}
</ol>

<h2>Add a question</h2>
<form method="post" action="/admin/faq" class="faq-admin-fields faq-admin-new">
  <label>Question <input type="text" name="question" required></label>
  <label>Answer <textarea name="answer" rows="3" required></textarea></label>
  <div class="faq-admin-actions"><button type="submit">Add to the bottom</button></div>
</form>
{% endblock %}
