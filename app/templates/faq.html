{% extends "base.html" %}
{% block title %}FAQ{% endblock %}

{% block content %}
<h1>FAQ</h1>

{% if not entries %}
<img class="empty-state-mascot" src="/static/img/jester-rider.png" alt="">
<p>Questions and answers will show up here soon.</p>
{% else %}
{% for f in entries %}
<div class="faq-item">
  <h2 class="faq-question">{{ f.question }}</h2>
  <div class="faq-answer">{{ f.answer }}</div>
</div>
{% endfor %}
{% endif %}
{% endblock %}
